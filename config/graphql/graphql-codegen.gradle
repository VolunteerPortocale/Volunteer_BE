tasks.named("graphqlCodegen") {
    graphqlSchemaPaths = ["$projectDir/src/main/resources/graphql/schema.graphqls".toString()]
    outputDir = file(layout.buildDirectory.dir("generated/graphql"))
    packageName = "com.portocale.volunteer.graphql.model"
    modelNameSuffix = "GQL"
    generateApis = false
    modelValidationAnnotation = "@jakarta.validation.constraints.NotNull"
}

sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.dir("generated/graphql")
        }
    }
}

tasks.named("compileKotlin") {
    dependsOn("graphqlCodegen")
}